---
name: Release Artifacts

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Build release artifact
        shell: bash
        run: |
          version='${{ github.event.release.tag_name }}'
          version="${version#v}"
          make all VERSION="$version"
          cd dist
          sha256sum -c letsencrypt-routeros.bash.sha256

      - name: Attach validated files to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload '${{ github.event.release.tag_name }}' \
            dist/letsencrypt-routeros.bash \
            dist/letsencrypt-routeros.bash.sha256 \
            --clobber
