---
name: Validate

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen

      - name: Prepare and verify dependencies
        run: |
          make deps
          make deps-check

      - name: Build and syntax-check distribution artifact
        run: |
          make build
          make check
          cd dist
          sha256sum -c letsencrypt-routeros.bash.sha256

      - name: Verify ADR inventory
        run: |
          make adr-index
          git diff --exit-code -- doc/adr/README.md

      - name: Generate reference documentation
        run: make docs
