---
name: Validate

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats doxygen

      - name: Prepare and verify dependencies
        run: |
          make deps
          make deps-check

      - name: Build distribution artifacts
        run: |
          make build
          make check

      - name: Verify distribution artifact contract
        shell: bash
        run: |
          expected=(
            letsencrypt-routeros.dev.bash
            letsencrypt-routeros.dev.bash.sha256
            letsencrypt-routeros.bash
            letsencrypt-routeros.bash.sha256
            letsencrypt-routeros.min.bash
            letsencrypt-routeros.min.bash.sha256
          )
          shopt -s nullglob
          actual=(dist/*)
          test "${#actual[@]}" -eq "${#expected[@]}"
          for file in "${expected[@]}"; do
            test -f "dist/${file}"
          done

          cd dist
          for checksum in *.bash.sha256; do
            sha256sum -c "${checksum}"
          done
          cd ..

          grep -F '# Generated by make build. Do not edit directly.' \
            dist/letsencrypt-routeros.dev.bash

          line_number=0
          while IFS= read -r line || [[ -n "${line}" ]]; do
            ((line_number += 1))
            if (( line_number > 1 )) && [[ "${line}" =~ ^[[:space:]]*# ]]; then
              printf '%s\n' 'ordinary artifact retained a full-line comment' >&2
              exit 1
            fi
          done <dist/letsencrypt-routeros.bash

          if cmp -s \
            dist/letsencrypt-routeros.bash \
            dist/letsencrypt-routeros.min.bash; then
            printf '%s\n' 'minified artifact is byte-identical to ordinary artifact' >&2
            exit 1
          fi

          for artifact in dist/*.bash; do
            bash -c '
              source "$1"
              [[ -n "$ROUTEROS_SSL_PROJECT_NAME" ]]
              [[ -n "$ROUTEROS_SSL_VERSION" ]]
              [[ -n "$ROUTEROS_SSL_BUILD_DATE" ]]
              [[ -n "$ROUTEROS_SSL_BUILD_COMMIT" ]]
            ' _ "${artifact}"
          done

      - name: Verify deterministic build output
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/first-build"
          cp dist/*.bash dist/*.bash.sha256 "${RUNNER_TEMP}/first-build/"
          make build
          for artifact in dist/*.bash dist/*.bash.sha256; do
            cmp "${RUNNER_TEMP}/first-build/${artifact##*/}" "${artifact}"
          done

      - name: Run TAP tests against root and all flavors
        run: make test

      - name: Verify committed compatibility artifact
        run: git diff --exit-code -- letsencrypt-routeros.bash

      - name: Verify ADR inventory
        run: |
          make adr-index
          git diff --exit-code -- doc/adr/README.md

      - name: Generate reference documentation
        run: make docs

      - name: Preserve test results and event metadata
        if: (!cancelled())
        run: |
          mkdir -p test-results
          cp "${GITHUB_EVENT_PATH}" test-results/event.json

      - name: Upload test results
        if: (!cancelled())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routeros-ssl-test-results
          path: test-results/
          if-no-files-found: error
          retention-days: 7
